name: Deploy NextJS App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

          SCANNER_SESSION_SECRET: ${{ secrets.SCANNER_SESSION_SECRET }}

          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
          MIDTRANS_IS_PRODUCTION: ${{ secrets.MIDTRANS_IS_PRODUCTION }}

          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          FONNTE_GROUP_FUN_RUN: ${{ secrets.FONNTE_GROUP_FUN_RUN }}
          FONNTE_GROUP_STMS: ${{ secrets.FONNTE_GROUP_STMS }}
          FONNTE_GROUP_CERDAS_CERMAT: ${{ secrets.FONNTE_GROUP_CERDAS_CERMAT }}
          FONNTE_GROUP_MEWARNAI: ${{ secrets.FONNTE_GROUP_MEWARNAI }}

          TICKET_PUBLIC_BASE_URL: ${{ secrets.TICKET_PUBLIC_BASE_URL }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        shell: bash
        run: |
          set -eu
          umask 077

          {
            printf "DATABASE_URL='%s'\n" "$DATABASE_URL"
            printf "DIRECT_URL='%s'\n" "$DIRECT_URL"
            printf "ADMIN_USERNAME='%s'\n" "$ADMIN_USERNAME"
            printf "ADMIN_PASSWORD_HASH='%s'\n" "$ADMIN_PASSWORD_HASH"

            printf "SCANNER_SESSION_SECRET='%s'\n" "$SCANNER_SESSION_SECRET"

            printf "AUTH_SECRET='%s'\n" "$AUTH_SECRET"
            printf "MIDTRANS_SERVER_KEY='%s'\n" "$MIDTRANS_SERVER_KEY"
            printf "NEXT_PUBLIC_MIDTRANS_CLIENT_KEY='%s'\n" "$NEXT_PUBLIC_MIDTRANS_CLIENT_KEY"
            printf "MIDTRANS_IS_PRODUCTION='%s'\n" "$MIDTRANS_IS_PRODUCTION"
            
            printf "FONNTE_TOKEN='%s'\n" "$FONNTE_TOKEN"
            printf "FONNTE_GROUP_FUN_RUN='%s'\n" "$FONNTE_GROUP_FUN_RUN"
            printf "FONNTE_GROUP_STMS='%s'\n" "$FONNTE_GROUP_STMS"
            printf "FONNTE_GROUP_CERDAS_CERMAT='%s'\n" "$FONNTE_GROUP_CERDAS_CERMAT"
            printf "FONNTE_GROUP_MEWARNAI='%s'\n" "$FONNTE_GROUP_MEWARNAI"

            printf "TICKET_PUBLIC_BASE_URL='%s'\n" "$TICKET_PUBLIC_BASE_URL"

            printf "SUPABASE_URL='%s'\n" "$SUPABASE_URL"
            printf "SUPABASE_SERVICE_ROLE_KEY='%s'\n" "$SUPABASE_SERVICE_ROLE_KEY"
            printf "SUPABASE_STORAGE_BUCKET='%s'\n" "$SUPABASE_STORAGE_BUCKET
            
          } > .env

          test -s .env
          test -n "$NEXT_PUBLIC_MIDTRANS_CLIENT_KEY"

      - name: Build and Deploy
        env:
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
        shell: bash
        run: |
          set -eu

          docker compose build --no-cache \
            --build-arg NEXT_PUBLIC_MIDTRANS_CLIENT_KEY="$NEXT_PUBLIC_MIDTRANS_CLIENT_KEY"

          docker compose up -d --force-recreate
